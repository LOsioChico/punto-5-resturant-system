name: Database Backup

on:
  schedule:
    # Every hour
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch previous backup from latest tag
        run: |
          # Fetch all backup tags (shallow)
          git fetch --tags --depth=1 origin "refs/tags/backup-*:refs/tags/backup-*" || true
          # Find the latest backup tag
          LATEST_TAG=$(git tag -l "backup-*" --sort=-version:refname | head -1)
          if [ -n "$LATEST_TAG" ]; then
            git show "$LATEST_TAG:data.sql.gz" > prev_data.sql.gz 2>/dev/null && echo "Found previous backup ($LATEST_TAG)" || echo "No previous backup"
          else
            echo "No previous backup tag found"
          fi

      - name: Dump data (pg_dump 17 via Docker, no install needed)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work postgres:17-alpine \
            pg_dump "$SUPABASE_DB_URL" --data-only --no-owner --no-privileges --column-inserts -f data.sql

      - name: Check if data changed (normalized)
        id: changed
        run: |
          # Strip volatile restrict/unrestrict tokens that change every dump
          grep -v '^\\restrict\|^\\unrestrict\|^-- \\restrict\|^-- \\unrestrict' data.sql > data_normalized.sql
          CURRENT_HASH=$(md5sum data_normalized.sql | awk '{print $1}')
          echo "Current data hash: $CURRENT_HASH"
          
          if [ -f prev_data.sql.gz ]; then
            gunzip -c prev_data.sql.gz > prev_data.sql
            grep -v '^\\restrict\|^\\unrestrict\|^-- \\restrict\|^-- \\unrestrict' prev_data.sql > prev_data_normalized.sql
            PREV_HASH=$(md5sum prev_data_normalized.sql | awk '{print $1}')
            echo "Previous data hash: $PREV_HASH"
            
            if [ "$CURRENT_HASH" = "$PREV_HASH" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "No changes since last backup — skipping."
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Data changed — will backup."
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No previous backup — will backup."
          fi

      - name: Compress
        if: steps.changed.outputs.changed == 'true'
        run: gzip data.sql

      - name: Upload artifact (90 day retention)
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: data.sql.gz
          retention-days: 90

      - name: Push backup as tag (not a branch — avoids triggering Vercel)
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BACKUP_TAG="backup-$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          # Create an orphan commit containing only data.sql.gz.
          # This keeps the tag self-contained (just the backup file)
          # and doesn't pollute any branch or trigger Vercel deployments.
          mv data.sql.gz /tmp/data.sql.gz
          git checkout --orphan backup-tmp
          git rm -rf . 2>/dev/null || true
          mv /tmp/data.sql.gz .
          git add data.sql.gz
          git commit -m "Backup $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git tag "$BACKUP_TAG"
          git push origin "$BACKUP_TAG"
