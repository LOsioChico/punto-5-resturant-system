name: Database Backup

on:
  schedule:
    # Every hour
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch previous backup from backups branch
        run: |
          git fetch origin backups --depth=1 || true
          git show origin/backups:data.sql.gz > prev_data.sql.gz 2>/dev/null && echo "Found previous backup" || echo "No previous backup"

      - name: Dump data (pg_dump directly, no CLI needed)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Force IPv4 (GitHub runners don't have IPv6 outbound)
          HOST=$(echo "$SUPABASE_DB_URL" | sed -n 's|.*@\([^:]*\).*|\1|p')
          IPV4=$(dig +short A "$HOST" | head -1)
          if [ -z "$IPV4" ]; then
            IPV4=$(nslookup "$HOST" | grep "Address:" | tail -1 | awk '{print $2}')
          fi
          echo "Resolved $HOST -> $IPV4"
          pg_dump "$SUPABASE_DB_URL" --data-only --no-owner --no-privileges --column-inserts --host="$IPV4" -f data.sql

      - name: Check if data changed (normalized)
        id: changed
        run: |
          # Strip volatile restrict/unrestrict tokens that change every dump
          grep -v '^-- \\restrict\|^-- \\unrestrict' data.sql > data_normalized.sql
          CURRENT_HASH=$(md5sum data_normalized.sql | awk '{print $1}')
          echo "Current data hash: $CURRENT_HASH"
          
          if [ -f prev_data.sql.gz ]; then
            gunzip -c prev_data.sql.gz > prev_data.sql
            grep -v '^-- \\restrict\|^-- \\unrestrict' prev_data.sql > prev_data_normalized.sql
            PREV_HASH=$(md5sum prev_data_normalized.sql | awk '{print $1}')
            echo "Previous data hash: $PREV_HASH"
            
            if [ "$CURRENT_HASH" = "$PREV_HASH" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "No changes since last backup — skipping."
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Data changed — will backup."
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No previous backup — will backup."
          fi

      - name: Compress
        if: steps.changed.outputs.changed == 'true'
        run: gzip data.sql

      - name: Upload artifact (90 day retention)
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: data.sql.gz
          retention-days: 90

      - name: Commit to backups branch
        if: steps.changed.outputs.changed == 'true'
        run: |
          mv data.sql.gz /tmp/data.sql.gz
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan backups
          git rm -rf . 2>/dev/null || true
          mv /tmp/data.sql.gz .
          git add data.sql.gz
          git commit -m "Backup $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin backups --force
