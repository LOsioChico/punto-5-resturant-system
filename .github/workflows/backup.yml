name: Database Backup

on:
  schedule:
    # Every hour
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Fetch previous backup from backups branch
        run: |
          git fetch origin backups --depth=1 || true
          git show origin/backups:data.sql.gz > prev_data.sql.gz 2>/dev/null || echo "No previous backup"

      - name: Dump current database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db dump --linked --file schema.sql
          supabase db dump --linked --data-only --use-copy --file data.sql

      - name: Compress
        run: |
          gzip schema.sql
          gzip data.sql

      - name: Check if data changed
        id: changed
        run: |
          if [ -f prev_data.sql.gz ]; then
            if cmp -s prev_data.sql.gz data.sql.gz; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "No changes since last backup — skipping."
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Data changed — will backup."
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No previous backup — will backup."
          fi

      - name: Upload artifacts (90 day retention)
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: |
            schema.sql.gz
            data.sql.gz
          retention-days: 90

      - name: Commit to backups branch
        if: steps.changed.outputs.changed == 'true'
        run: |
          # Move dump files out of the working tree before cleaning
          mv schema.sql.gz /tmp/schema.sql.gz
          mv data.sql.gz /tmp/data.sql.gz
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan backups
          git rm -rf . 2>/dev/null || true
          mv /tmp/schema.sql.gz /tmp/data.sql.gz .
          git add schema.sql.gz data.sql.gz
          git commit -m "Backup $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin backups --force
